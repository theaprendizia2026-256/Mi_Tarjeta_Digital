<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarjeta Digital - Mi Galería</title>
    
    <meta name="theme-color" content="#2c1810">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
        <div class="header">
            <div class="logo">
                <img src="images/logo.png" alt="Logo Mi Galería">
            </div>
            <div class="subtitle">TARJETA DIGITAL</div>
            <div class="subtitle">Mi Galería</div>
        </div>

        <div class="content"> 
            <!-- Instagram -->
            <div class="info-item">
                <div class="icon"><i class="fab fa-instagram"></i></div>
                <div class="info-text">
                    <a href="https://www.instagram.com/mi_galeria2026" target="_blank">@mi_galeria2026</a>
                </div>
            </div>

            <!-- Telegram -->
            <div class="info-item">
                <div class="icon"><i class="fab fa-telegram"></i></div>
                <div class="info-text">
                    <a href="https://t.me/Mi_Galeria2026" target="_blank">Telegram</a>
                </div>
            </div>

            <!-- Sitio Web Vercel -->
            <div class="info-item">
                <div class="icon"><i class="fas fa-globe"></i></div>
                <div class="info-text">
                    <a href="https://mi-galeria2026.vercel.app/" target="_blank">mi-galeria2026.vercel.app</a>
                </div>
            </div>

            <!-- Correo Outlook -->
            <div class="info-item">
                <div class="icon"><i class="fas fa-envelope"></i></div>
                <div class="info-text">
                    <a href="mailto:MiGaleria2026@outlook.es">MiGaleria2026@outlook.es</a>
                </div>
            </div>

            <div class="divider"></div>
        </div>

        <div class="qr-section">
            <div class="qr-code">
                <img src="images/QR.png" alt="Código QR Mi Galería">
            </div>
        </div>

        <div class="footer">
            <p class="tagline">"El arte no reproduce lo visible; hace visible lo invisible."</p>
        </div>

        <div class="gallery-container">
            <div class="gallery-grid">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785636856/foto_1_lqdnco.jpg" alt="Obra 1" 
                loading="lazy">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785636853/foto_2_b8tdqz.jpg" alt="Obra 2" 
                loading="lazy">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785636857/foto_3_b6i1f0.jpg" alt="Obra 3" 
                loading="lazy">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785636855/foto_4_wcx6eu.jpg" alt="Obra 4" 
                loading="lazy">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785636856/foto_5_rfmkiy.jpg" alt="Obra 5" 
                loading="lazy">
            </div>
        </div>
  </div>

  <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./ServiceWorker.js')
                    .then(reg => console.log('Service Worker registrado con éxito'))
                    .catch(err => console.error('Error al registrar Service Worker', err));
            });
        }
  </script>

</body>
</html>
